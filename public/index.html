<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: no iPhone instalado, o app ocupa a tela toda (inclusive atrás da barra de status). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tripi</title>
    <meta name="description" content="Sua viagem inteira, num lugar só: roteiro, reservas, gastos e documentos." />

    <!-- Instalação: "Adicionar à Tela de Início" no iPhone e app instalável no Android/Chrome. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tripi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#F2F4F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06100D" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #f2f4f3;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #06100d;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Para usar o Tripi, ative o JavaScript no navegador.</noscript>
    <div id="root"></div>
  </body>
</html>
