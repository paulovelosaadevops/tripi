openapi: 3.1.0
info:
  title: Tripi API
  version: 0.1.0
paths:
  /v1/health:
    get:
      summary: Technical health endpoint
      operationId: getHealth
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                type: object
                required:
                  - service
                  - status
                properties:
                  service:
                    type: string
                    const: tripi-api
                  status:
                    type: string
                    const: UP
