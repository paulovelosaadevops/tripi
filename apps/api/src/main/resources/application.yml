spring:
  application:
    name: tripi-api
  datasource:
    url: ${TRIPI_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/tripi}
    username: ${TRIPI_DATABASE_USERNAME:tripi}
    password: ${TRIPI_DATABASE_PASSWORD:change-me-local-only}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${TRIPI_API_PORT:8080}

tripi:
  identity:
    tokens:
      issuer: ${TRIPI_JWT_ISSUER:tripi-api}
      audience: ${TRIPI_JWT_AUDIENCE:tripi-mobile}
      key-id: ${TRIPI_JWT_KEY_ID:local-dev}
      private-key: ${TRIPI_JWT_PRIVATE_KEY:}
      public-key: ${TRIPI_JWT_PUBLIC_KEY:}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
