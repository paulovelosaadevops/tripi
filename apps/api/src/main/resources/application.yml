spring:
  application:
    name: tripi-api
  datasource:
    url: ${TRIPI_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/tripi}
    username: ${TRIPI_DATABASE_USERNAME:tripi}
    password: ${TRIPI_DATABASE_PASSWORD:change-me-local-only}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${TRIPI_API_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
